version: '3.8'

services:
  chm-college-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chm_college_portal
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
