name: CI/CD & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate HTML Structure
        run: |
          echo "Validating core pages exist..."
          test -f index.html
          test -f portal.html
          test -f admission.html
          test -f fee-payment.html
          test -f exams.html
          test -f naac-iqac.html
          test -f placement.html
          test -f alumni.html
          test -f research.html
          test -f faculty.html
          test -f parent-portal.html
          test -f governance.html
          test -f campus-tour.html
          test -f scholarships.html
          test -f question-bank.html
          test -f events.html
          test -f digital-library.html
          test -f assessment-tools.html
          echo "All core pages successfully verified!"

  deploy-pages:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
